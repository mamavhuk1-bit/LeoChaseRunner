plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.runner'
    compileSdk 34

    defaultConfig {
        applicationId "com.leo.runner"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "5.0"
    }

    signingConfigs {
        release {
            storeFile file("../leo-release.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "leocat2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "leo_key"
            keyPassword System.getenv("KEYSTORE_PASS") ?: "leocat2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
