name: Build Leo Cat v4 Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Signed Release APK v4
        run: gradle assembleRelease

      - name: Rename APK to Leo-Cat-v4.0.apk
        run: cp app/build/outputs/apk/release/app-release.apk Leo-Cat-v4.0.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leo-Cat-v4.0-APK
          path: Leo-Cat-v4.0.apk
